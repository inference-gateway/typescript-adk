schema-version = "1.12.0"

[install]
nodejs.pkg-path = "nodejs_26"
nodejs.version = "26.2.0"
pnpm.pkg-path = "pnpm"
pnpm.version = "11.1.2"
infer.flake = "github:inference-gateway/cli/v0.116.0"
claude-code.pkg-path = "claude-code"
claude-code.version = "2.1.148"
claude-code.pkg-group = "ai"
codex.pkg-path = "codex"
codex.version = "0.133.0"
codex.pkg-group = "ai"

[vars]
NODE_OPTIONS = "--no-warnings"

[hook]
on-activate = """
  pnpm install
"""
