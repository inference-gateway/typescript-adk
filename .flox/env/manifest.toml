schema-version = "1.19.0"

[install]
nodejs.pkg-path = "nodejs_26"
nodejs.version = "26.13.0"
pnpm.pkg-path = "pnpm"
pnpm.version = "12.9.0"
infer.flake = "github:inference-gateway/cli/v0.231.1"
claude-code.pkg-path = "claude-code"
claude-code.version = "2.1.321"
claude-code.pkg-group = "claude-code"
codex.pkg-path = "codex"
codex.version = "^0.167.1"
codex.pkg-group = "codex"

[vars]
NODE_OPTIONS = "--no-warnings"

[hook]
on-activate = """
  pnpm install
"""
