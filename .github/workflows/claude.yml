---
name: Claude Code

on:
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created
  issues:
    types:
      - opened
      - assigned
  pull_request_review:
    types:
      - submitted

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Install task
        uses: arduino/setup-task@v2.0.0
        with:
          version: 3.48.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install additional dependencies
        run: npm install -g markdownlint-cli

      - name: Install maintainer skill
        run: |
          mkdir -p ~/.claude/skills
          rm -rf ~/.claude/skills/maintainer
          curl -fsSL https://codeload.github.com/inference-gateway/skills/tar.gz/main |
            tar -xz --strip-components=2 -C ~/.claude/skills skills-main/skills/maintainer

      - name: Write Claude system prompt
        env:
          CLAUDE_SYSTEM_PROMPT: |
            **WHEN WORKING ON ISSUES:**
            After implementing and committing the changes, open a PR with:
            `gh pr create --title "<title>" --body "## Summary\n<summary>\n\nCloses #${{ github.event.issue.number }}"`
            Always include a summary and `Closes #${{ github.event.issue.number }}` in the body.

            **WHEN WORKING ON PR FEEDBACK:**
            Make the requested changes and commit. The PR will automatically update - do NOT create a new PR.

            **WHEN FIXING CI FAILURES:**
            Fix the issues and commit. CI will automatically re-run.

            **COMMIT RULES:**
            - Do NOT add "Co-authored-by" lines to commits
            - Do NOT add "Generated with Claude Code" or similar attributions
            - Use conventional commit format with lowercase type (e.g., "fix:", "feat:", "refactor:")
            - Subject line max 72 chars
        run: printf '%s' "$CLAUDE_SYSTEM_PROMPT" > "$RUNNER_TEMP/claude-system-prompt.txt"

      - name: Run Claude Code
        id: claude
        env:
          USE_SIMPLE_PROMPT: 'true'
        uses: anthropics/claude-code-action@v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          additional_permissions: |
            actions: read
          use_commit_signing: true
          base_branch: main
          branch_prefix: 'claude/'
          claude_args: |
            --effort max
            --model claude-opus-4-7
            --allowedTools "Bash(task:*),Bash(node:*),Bash(npm:*),Bash(pnpm:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh repo:*)"
            --mcp-config '{"mcpServers":{"context7":{"command":"npx","args":["-y","@upstash/context7-mcp@latest"]}}}'
            --system-prompt-file ${{ runner.temp }}/claude-system-prompt.txt
          track_progress: true
