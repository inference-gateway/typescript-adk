---
name: Infer

on:
  issues:
    types:
      - opened
      - edited
  issue_comment:
    types:
      - created

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  infer:
    if: |
      github.event.sender.type != 'Bot' &&
      !endsWith(github.actor, '[bot]') &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@infer')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@infer') || contains(github.event.issue.title, '@infer')))
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v3.2.0
        id: app_token
        with:
          client-id: ${{ secrets.INFER_APP_ID }}
          private-key: ${{ secrets.INFER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Install task
        uses: arduino/setup-task@v2.0.0
        with:
          version: 3.48.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install additional dependencies
        run: npm install -g markdownlint-cli

      - name: Run Infer Agent
        uses: inference-gateway/infer-action@v0.7.1
        with:
          debug: "true"
          compact-auto-at: "20"
          github-token: ${{ steps.app_token.outputs.token }}
          trigger-phrase: "@infer"
          model: deepseek/deepseek-v4-flash
          max-turns: 50
          skills: |
            maintainer
          bash-whitelist-commands: 'pnpm,npm,node,task,markdownlint,git,cat,ls,find,head,tail,wc,grep,mkdir'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cohere-api-key: ${{ secrets.COHERE_API_KEY }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
          ollama-cloud-api-key: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          moonshot-api-key: ${{ secrets.MOONSHOT_API_KEY }}
          # use-mock-agent: true
          # mock-agent-scenario: happy # happy | failures | no-todos | empty
